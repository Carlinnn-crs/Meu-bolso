<title>Meu Bolso</title>
<style>
:root{
  --bg:#F2F5FA;--card:#FFFFFF;--ink:#0B1B33;--muted:#667085;--line:#E1E6EF;
  --in:#1A8A55;--in-soft:#E1F3E8;--out:#D2502E;--out-soft:#FBE8E2;--chip:#E9EEF6;--shadow:0 1px 2px rgba(11,27,51,.06),0 6px 20px rgba(11,27,51,.05);
  --brand:#0B2A61;--brand2:#0058C4;--on-brand:#FFFFFF;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0C111A;--card:#151C28;--ink:#EEF2F8;--muted:#8D97AA;--line:#252E3E;
  --in:#4CC88A;--in-soft:#14302A;--out:#F07D60;--out-soft:#3A2019;--chip:#1E2635;--shadow:none;
  --brand:#2F7BEA;--brand2:#5A9CF5;--on-brand:#FFFFFF;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;font-size:16px}
body{padding-top:env(safe-area-inset-top);padding-bottom:calc(92px + env(safe-area-inset-bottom));min-height:100vh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:var(--ink)}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:520px;margin:0 auto;padding:14px 16px 20px}
.top{display:flex;align-items:flex-end;justify-content:space-between;margin:6px 2px 14px}
.top h1{font-size:27px;letter-spacing:-.02em;margin:0;font-weight:800;display:flex;align-items:center;gap:9px;color:var(--brand)}
.top h1 img{width:46px;height:auto;display:block}
.top h1 b{color:var(--brand2);font-weight:800}
@media (prefers-color-scheme:dark){.top h1{color:var(--ink)}}
#splash{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .35s ease}
#splash img{width:min(68vw,280px);height:auto;animation:pop .5s ease-out}
#splash.out{opacity:0;pointer-events:none}
@media (prefers-color-scheme:dark){#splash .lt{display:none}#splash div.dk{display:flex}}
#splash .dk{display:none;flex-direction:column;align-items:center;gap:14px;font-size:34px;font-weight:800;color:var(--ink);animation:pop .5s ease-out}
#splash .dk img{width:min(46vw,190px)}
#splash .dk b{color:var(--brand2)}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.cloud i{background:var(--in)}
.period{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:14px;padding:6px;box-shadow:var(--shadow);margin-bottom:14px}
.period button{width:40px;height:36px;border-radius:10px;font-size:20px;color:var(--muted)}
.period button:active{background:var(--chip)}
.period b{font-size:16px;font-weight:650;text-transform:capitalize}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 12px;font-weight:650}
.hero .lbl{font-size:13px;color:var(--muted)}
.hero .big{font-size:36px;font-weight:750;letter-spacing:-.03em;margin:2px 0 12px}
.big.pos{color:var(--in)} .big.neg{color:var(--out)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pill{border-radius:14px;padding:10px 12px}
.pill.in{background:var(--in-soft)} .pill.out{background:var(--out-soft)}
.pill .lbl{font-size:12px} .pill .v{font-size:19px;font-weight:700;margin-top:2px}
.pill.in .v{color:var(--in)} .pill.out .v{color:var(--out)}
.meter{height:10px;border-radius:6px;background:var(--chip);overflow:hidden;margin:14px 0 6px}
.meter span{display:block;height:100%;border-radius:6px;background:var(--out)}
.meter-txt{font-size:13px;color:var(--muted)}
.insights{list-style:none;margin:0;padding:0}
.insights li{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:15px;line-height:1.35}
.insights li:first-child{border-top:0;padding-top:0}
.insights .e{flex:none;width:22px;text-align:center}
.cat{display:grid;grid-template-columns:28px 1fr auto;gap:4px 10px;align-items:center;padding:8px 0}
.cat .e{font-size:18px;grid-row:span 2}
.cat .n{font-size:15px;font-weight:550}
.cat .a{font-size:15px;font-weight:650;text-align:right}
.cat .bar{height:6px;border-radius:4px;background:var(--chip);overflow:hidden}
.cat .bar span{display:block;height:100%;background:var(--out);border-radius:4px}
.cat .p{font-size:12px;color:var(--muted);text-align:right}
.tx{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.tx:first-child{border-top:0}
.tx .ic{width:38px;height:38px;border-radius:12px;background:var(--chip);display:grid;place-items:center;font-size:18px;flex:none}
.tx .mid{flex:1;min-width:0}
.tx .d1{font-size:15px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .d2{font-size:12px;color:var(--muted);margin-top:2px}
.tx .amt{font-weight:650;font-size:15px}
.tx .amt.in{color:var(--in)}
.empty{color:var(--muted);font-size:15px;text-align:center;padding:18px 6px;line-height:1.45}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:-4px 0 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
svg text{font-family:inherit}
.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;z-index:5}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:6px 0;font-weight:550}
.tabs button svg{width:24px;height:24px}
.tabs button.on{color:var(--brand2)}
.tabs .add{flex:none;width:58px;height:58px;border-radius:50%;background:var(--brand);color:var(--on-brand);margin-top:-22px;box-shadow:0 6px 18px rgba(0,0,0,.22);display:grid;place-items:center;padding:0}
.tabs .add svg{width:28px;height:28px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:10;display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--chip);border-radius:12px;padding:3px;margin-bottom:14px}
.seg button{padding:9px;border-radius:10px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--brand);box-shadow:var(--shadow)}
.amount{display:flex;align-items:baseline;justify-content:center;gap:6px;margin:6px 0 14px}
.amount span{font-size:22px;color:var(--muted);font-weight:600}
.amount input{border:0;background:transparent;font-size:44px;font-weight:750;width:200px;text-align:center;outline:none;letter-spacing:-.02em}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.chips button{background:var(--card);border-radius:12px;padding:8px 2px;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:3px;border:2px solid transparent;color:var(--ink)}
.chips button .e{font-size:20px}
.chips button.on{border-color:var(--brand2);background:color-mix(in srgb,var(--brand2) 8%,var(--card))}
.field{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;outline:none;font-size:16px;-webkit-appearance:none;appearance:none;min-height:46px}
label.fl{display:block;font-size:13px;color:var(--muted);margin:0 2px 5px}
.primary{width:100%;background:var(--brand);color:var(--on-brand);border-radius:14px;padding:15px;font-weight:700;font-size:16px;margin-top:4px}
.ghost{width:100%;border-radius:14px;padding:13px;font-weight:600;color:var(--out);margin-top:6px}
.ghost.plain{color:var(--muted)}
.err{color:var(--out);font-size:13px;min-height:18px;margin:0 2px 6px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.2s;z-index:20;pointer-events:none;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.steps{margin:0;padding-left:20px;line-height:1.55;font-size:15px}
.steps li{margin-bottom:4px}
.note{font-size:13px;color:var(--muted);line-height:1.45;margin:8px 0 0}
textarea.field{min-height:120px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.hidden{display:none!important}
.tag{display:inline-block;font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:6px;background:var(--chip);color:var(--muted);margin-left:5px;vertical-align:1px}
.tag.cc{background:var(--out-soft);color:var(--out)}
.quick{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px 2px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick button{flex:none;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13.5px;white-space:nowrap}
.quick button b{font-weight:650}
.qlbl{font-size:12px;color:var(--muted);margin:0 2px 6px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.pm{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.pm button{background:var(--card);border:2px solid transparent;border-radius:10px;padding:8px 2px;font-size:13px;font-weight:550}
.pm button.on{border-color:var(--brand2);background:color-mix(in srgb,var(--brand2) 8%,var(--card))}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inst{background:var(--out-soft);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.inst label{font-size:13px;color:var(--out);font-weight:600;display:block;margin-bottom:6px}
.inst select{width:100%;font:inherit;font-size:16px;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.inst .h{font-size:13px;margin-top:6px;color:var(--ink)}
.rec{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.rec:first-of-type{border-top:0}
.rec.old{opacity:.55}
.addline{width:100%;text-align:center;padding:12px;border-radius:12px;background:var(--chip);font-weight:600;margin-top:8px;font-size:15px}
.sheet h3{margin:0 0 12px;font-size:19px;text-align:center}
:root{--warn:#C98A00}
@media (prefers-color-scheme:dark){:root{--warn:#F2B635}}
.goal{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.goal .gl{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;font-weight:600}
.goal .meter{margin-top:8px}
.goal .meter span{background:var(--brand2)}
.goal .meter-txt{line-height:1.4}
.limrow{display:grid;grid-template-columns:1fr 130px;gap:10px;align-items:center;font-size:15px}
.limrow .field{margin-bottom:6px;padding:8px 10px;min-height:40px;text-align:right}
.catgrid{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.catgrid button{background:var(--chip);border-radius:999px;padding:7px 12px;font-size:14px}
.catgrid.off button{opacity:.6}
.emo{display:flex;justify-content:center;margin-bottom:10px}
.emo input{font-size:44px;width:96px;height:84px;text-align:center;border:1px solid var(--line);border-radius:20px;background:var(--card);outline:none}
.emosug{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin-bottom:12px}
.emosug button{font-size:24px;width:42px;height:42px;border-radius:10px}
.emosug button:active{background:var(--chip)}
.seg.seg3{grid-template-columns:repeat(3,1fr)}
.search .field{margin-bottom:10px}
.search .seg{margin-bottom:0}
.mrow{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;font-size:14px;padding:4px 0}
.mrow .bar{height:8px;border-radius:4px;background:var(--chip);overflow:hidden}
.mrow .bar span{display:block;height:100%;background:var(--out);border-radius:4px}
.sheet.tall{height:92vh;display:flex;flex-direction:column;overflow:hidden}
.sheet.tall #i-list{flex:1;overflow:auto;margin:0 -16px;padding:0 16px;-webkit-overflow-scrolling:touch}
.itools{display:flex;gap:6px;justify-content:center;margin:10px 0}
.itools button{background:var(--chip);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.irow{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.irow:first-child{border-top:0}
.irow input[type=checkbox]{width:22px;height:22px;margin:2px 0 0;accent-color:var(--brand2)}
.irow.off .mid,.irow.off .amt{opacity:.45}
.irow .d1{font-size:14.5px;font-weight:550;word-break:break-word}
.irow .d2{font-size:12px;color:var(--muted);margin:2px 0 6px}
.irow .d2 i{font-style:normal;color:var(--warn);font-weight:600}
.irow select{font:inherit;font-size:14px;padding:5px 8px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
.irow .amt{font-weight:650;font-size:14.5px;white-space:nowrap}
.irow .amt.in{color:var(--in)}
.isticky{padding-top:10px;border-top:1px solid var(--line)}
</style>
</head>

<!-- Lançamento -->
<div class="overlay" id="ov">
  <div class="sheet" role="dialog" aria-label="Lançamento">
    <div class="grab"></div>
    <div class="seg" id="f-type">
      <button data-t="out" class="on">Gasto</button>
      <button data-t="in">Ganho</button>
    </div>
    <div id="f-quickwrap"><div class="qlbl">⚡ Rápido</div><div class="quick" id="f-quick"></div></div>
    <div class="amount"><span>R$</span><input id="f-val" class="num" inputmode="decimal" placeholder="0,00" autocomplete="off"></div>
    <div class="chips" id="f-cats"></div>
    <input class="field" id="f-desc" list="f-descs" placeholder="Descrição (opcional) — ex: iFood, Uber" maxlength="60" autocomplete="off">
    <datalist id="f-descs"></datalist>
    <div class="pm" id="f-pm">
      <button data-p="pix">Pix</button><button data-p="debito">Débito</button><button data-p="credito">Crédito</button><button data-p="dinheiro">Dinheiro</button>
    </div>
    <div class="inst hidden" id="f-inst">
      <label for="f-n">💳 Parcelado?</label>
      <select id="f-n"></select>
      <div class="h num" id="f-insth"></div>
    </div>
    <div class="note hidden" id="f-parcinfo" style="margin:0 2px 10px"></div>
    <input class="field" id="f-date" type="date">
    <div class="err" id="f-err"></div>
    <button class="primary" id="f-save">Salvar</button>
    <button class="ghost hidden" id="f-del">Apagar</button>
    <button class="ghost plain" id="f-cancel">Cancelar</button>
  </div>
</div>

<!-- Ganho/conta fixa -->
<div class="overlay" id="ov3">
  <div class="sheet" role="dialog" aria-label="Fixo">
    <div class="grab"></div>
    <h3 id="r-title">Conta fixa</h3>
    <div class="seg" id="r-type">
      <button data-t="out">Conta fixa</button>
      <button data-t="in">Ganho fixo</button>
    </div>
    <input class="field" id="r-name" placeholder="Nome — ex: Aluguel, Internet, Salário" maxlength="40" autocomplete="off">
    <div class="amount"><span>R$</span><input id="r-val" class="num" inputmode="decimal" placeholder="0,00" autocomplete="off"></div>
    <div class="chips" id="r-cats"></div>
    <div class="row2">
      <div><label class="fl" for="r-day">Todo dia</label><input class="field num" id="r-day" type="number" inputmode="numeric" min="1" max="31"></div>
      <div><label class="fl" for="r-from" id="r-fromlbl">Começa em</label><input class="field" id="r-from" type="month"></div>
    </div>
    <p class="note hidden" id="r-hint" style="margin:-2px 2px 10px"></p>
    <div class="err" id="r-err"></div>
    <button class="primary" id="r-save">Salvar</button>
    <button class="ghost hidden" id="r-stop">Parar de contar a partir deste mês</button>
    <button class="ghost hidden" id="r-del">Apagar de todo o histórico</button>
    <button class="ghost plain" id="r-cancel">Cancelar</button>
  </div>
</div>

<!-- Confirmação -->
<div class="overlay" id="ov2">
  <div class="sheet">
    <div class="grab"></div>
    <p style="font-size:17px;font-weight:600;text-align:center;margin:6px 0 4px" id="c-msg">Apagar?</p>

    <button class="primary" style="background:var(--out);color:#fff" id="c-yes">Apagar</button>

    <button class="ghost plain" id="c-no">Cancelar</button>
  </div>
</div>

    <button class="ghost hidden" id="k-hide">Ocultar esta categoria</button>
    <button class="ghost plain hidden" id="k-reset">Voltar ao nome e emoji originais</button>
    <button class="ghost plain" id="k-cancel">Cancelar</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
/* ---------- Base ---------- */
const BASE_OUT=[["mercado","Mercado","🛒"],["comida","Comida fora","🍔"],["transporte","Transporte","🚗"],["moradia","Moradia","🏠"],["contas","Contas","💡"],["saude","Saúde","💊"],["lazer","Lazer","🎉"],["compras","Compras","🛍️"],["educacao","Educação","📚"],["assinaturas","Assinaturas","📺"],["cartao","Cartão/Dívida","💳"],["outros","Outros","📦"]];
const BASE_IN=[["salario","Salário","💼"],["extra","Extra/Bico","💰"],["outros_in","Outros","➕"]];
const EMOJIS=["🐶","🐱","👶","⛪","🎁","💇","🏋️","✈️","🎮","🍺","☕","🧾","🛠️","🚌","⛽","🏍️","👗","💄","🎓","🏥","🙏","💸","📱","🏦"];
const PM={pix:"Pix",debito:"Débito",credito:"Crédito",dinheiro:"Dinheiro"};
const MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const MES3=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];

const fmt=new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
const money=c=>fmt.format((c||0)/100);
const pad=n=>String(n).padStart(2,"0");
const keyOf=(y,m)=>y+"-"+pad(m+1);
const today=new Date();
const todayKey=keyOf(today.getFullYear(),today.getMonth());
const todayISO=todayKey+"-"+pad(today.getDate());
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const $=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const norm=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim();
function addMonths(key,n){const y=+key.slice(0,4),m=+key.slice(5,7)-1+n;return keyOf(y+Math.floor(m/12),((m%12)+12)%12);}
const daysIn=key=>new Date(+key.slice(0,4),+key.slice(5,7),0).getDate();
const keyLabel=k=>MES3[+k.slice(5,7)-1]+"/"+k.slice(2,4);
const centsToField=c=>c?(c/100).toFixed(2).replace(".",","):"";
const pct=(a,b)=>b>0?Math.round(a/b*100):0;
function parseMoney(s){
  s=String(s||"").replace(/[R$\s]/g,"");
  if(!s) return NaN;
  if(s.includes(",")) s=s.replace(/\./g,"").replace(",",".");
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,"");
  const v=Number(s); return isFinite(v)?Math.round(v*100):NaN;
}
function firstEmoji(s){
  s=String(s||"").trim(); if(!s) return "";
  try{ if(window.Intl&&Intl.Segmenter){ const it=new Intl.Segmenter("pt",{granularity:"grapheme"}).segment(s)[Symbol.iterator]().next(); return it.value?it.value.segment:""; } }catch(e){}
  return Array.from(s).slice(0,2).join("");
}

/* ---------- Estado ---------- */
let months={};
let settings=null, CAT={};
let selY=today.getFullYear(), selM=today.getMonth(), yearSel=selY;
let view="mes";
const store={mode:"local",col:null,setRef:null};
const LS="meusgastos_v1";

function normalize(raw){
  const s=Object.assign({limit:0,goal:0,rec:[],lastPm:"pix",catLimits:{},cats:{}},raw||{});
  if(!Array.isArray(s.rec)) s.rec=[];
  if(!s.catLimits||typeof s.catLimits!=="object") s.catLimits={};
  const c=s.cats&&typeof s.cats==="object"?s.cats:{};
  s.cats={custom:Array.isArray(c.custom)?c.custom:[],over:c.over&&typeof c.over==="object"?c.over:{},hidden:Array.isArray(c.hidden)?c.hidden:[]};
  if(s.salary>0&&!s.rec.some(r=>r.id==="sal")) s.rec.push({id:"sal",t:"in",name:"Salário",cat:"salario",c:s.salary,day:5,from:s.salaryStart||todayKey,to:""});
  delete s.salary; delete s.salaryStart;
  return s;
}
function rebuildCats(){
  CAT={}; const cs=settings.cats;
  const mk=(c,t)=>{const o=cs.over[c[0]]||{}; CAT[c[0]]={id:c[0],t,name:o.name||c[1],e:o.e||c[2],hidden:cs.hidden.includes(c[0]),base:true,orig:c};};
  BASE_OUT.forEach(c=>mk(c,"out")); BASE_IN.forEach(c=>mk(c,"in"));
  cs.custom.forEach(c=>{CAT[c.id]={id:c.id,t:c.t,name:c.name,e:c.e,hidden:!!c.hidden,base:false};});
}
function applySettings(s){ settings=normalize(s); rebuildCats(); }
const catList=t=>Object.values(CAT).filter(c=>c.t===t&&!c.hidden);
const catOf=k=>CAT[k]||{id:k,name:"Outros",e:"📦"};
applySettings(null);

/* ---------- Armazenamento ---------- */
function loadLocal(){ try{const raw=localStorage.getItem(LS); return raw?JSON.parse(raw):null;}catch(e){return null;} }
function saveLocal(){ try{localStorage.setItem(LS,JSON.stringify({months,settings}));}catch(e){} }
const queues={};
function persistMonth(key){
  if(store.mode==="cloud"){
    const items=(months[key]||[]).slice();
    const ref=store.col.doc("m"+key);
    queues[key]=(queues[key]||Promise.resolve()).then(()=>items.length?ref.set({key:key,items:items}):ref.delete())
      .catch(e=>toast(e&&e.code==="quota_exceeded"?"Espaço cheio — apague lançamentos antigos.":"Não consegui salvar agora. Tente de novo."));
  } else saveLocal();
}
let setQ=Promise.resolve();
function persistSettings(){
  if(store.mode==="cloud"){
    const body=JSON.parse(JSON.stringify(settings));
    setQ=setQ.then(()=>store.setRef.set(body)).catch(()=>toast("Não consegui salvar os ajustes."));
  } else saveLocal();
}
function setSync(mode){
  const el=$("sync"); el.className="sync"+(mode==="cloud"?" cloud":"");
  el.querySelector("span").textContent=mode==="cloud"?"salvo na sua conta":"salvo neste aparelho";
}
/* ---------- Cálculos ---------- */
function recFor(key){
  if(key>todayKey) return [];
  return settings.rec.filter(r=>r.from<=key&&(!r.to||key<=r.to)).map(r=>({id:"rec_"+r.id,rid:r.id,v:true,t:r.t,c:r.c,cat:r.cat,d:r.name,date:key+"-"+pad(Math.min(r.day||1,daysIn(key)))}));
}
function monthItems(key){ return recFor(key).concat(months[key]||[]); }
function stats(key){
  const items=monthItems(key);
  let inc=0,out=0,fixedOut=0,credit=0; const cats={};
  items.forEach(x=>{ if(x.t==="in") inc+=x.c; else {out+=x.c; cats[x.cat]=(cats[x.cat]||0)+x.c; if(x.v) fixedOut+=x.c; if(x.pm==="credito") credit+=x.c;} });
  return {inc,out,fixedOut,credit,cats,items};
}
function futureInstallments(){ let tot=0; Object.keys(months).forEach(k=>{ if(k>todayKey) (months[k]||[]).forEach(x=>{ if(x.g&&x.t!=="in") tot+=x.c; }); }); return tot; }
const sortedCats=cats=>Object.keys(cats).map(k=>[k,cats[k]]).sort((a,b)=>b[1]-a[1]);
function allItems(){ const a=[]; Object.keys(months).forEach(k=>(months[k]||[]).forEach(x=>a.push(x))); return a; }
function allKeys(){
  const s=new Set(Object.keys(months).filter(k=>(months[k]||[]).length));
  const st=settings.rec.reduce((m,r)=>r.from<m?r.from:m,todayKey);
  for(let k=st;k<=todayKey;k=addMonths(k,1)) if(recFor(k).length) s.add(k);
  return Array.from(s).sort();
}
function limitAlerts(key,s){
  const out=[];
  Object.keys(settings.catLimits).forEach(k=>{ const L=settings.catLimits[k]; if(!(L>0)||!CAT[k]) return; const v=s.cats[k]||0, p=pct(v,L);
    if(p>100) out.push([p,"🚨",`<b>${esc(catOf(k).name)}</b>: passou <b>${money(v-L)}</b> do limite de ${money(L)}.`]);
    else if(p>=80) out.push([p,"⚠️",`<b>${esc(catOf(k).name)}</b>: ${p}% do limite. Faltam só <b>${money(L-v)}</b>.`]); });
  return out.sort((a,b)=>b[0]-a[0]).map(x=>[x[1],x[2]]);
}

/* ---------- Pedaços de tela ---------- */
function catRows(cats,total,lim){
  const all=Object.assign({},cats);
  if(lim) Object.keys(lim).forEach(k=>{ if(lim[k]>0&&!(k in all)&&CAT[k]&&!CAT[k].hidden&&CAT[k].t==="out") all[k]=0; });
  const list=sortedCats(all);
  if(!list.length) return '<div class="empty">Nenhum gasto ainda.</div>';
  const max=Math.max(1,list[0][1]);
  return list.map(([k,v])=>{const c=catOf(k), L=lim&&lim[k]>0?lim[k]:0; let bar,sub;
    if(L){const p=v/L*100, col=p>100?"var(--out)":p>=80?"var(--warn)":"var(--in)";
      bar=`<span style="width:${v?Math.max(3,Math.min(100,p)):0}%;background:${col}"></span>`; sub=`${Math.round(p)}% de ${money(L)}`;}
    else {bar=`<span style="width:${Math.max(3,v/max*100)}%"></span>`; sub=`${pct(v,total)}%`;}
    return `<div class="cat"><div class="e">${esc(c.e)}</div><div class="n">${esc(c.name)}</div><div class="a num">${money(v)}</div>
      <div class="bar">${bar}</div><div class="p num">${sub}</div></div>`;}).join("");
}
function txRow(x,key){
  key=key||x.date.slice(0,7);
  const c=catOf(x.cat); const dd=x.date.slice(8,10)+" "+MES3[+x.date.slice(5,7)-1]+(x.date.slice(0,4)!==String(selY)?" "+x.date.slice(2,4):"");
  let tags="";
  if(x.v) tags+=`<span class="tag">fixo</span>`;
  if(x.v&&x.date>todayISO) tags+=`<span class="tag">previsto</span>`;
  if(x.g) tags+=`<span class="tag cc">${x.n}/${x.of}</span>`; else if(x.pm==="credito") tags+=`<span class="tag cc">crédito</span>`;
  const attrs=x.v?`data-rec="${esc(x.rid)}" data-k="${key}"`:`data-id="${esc(x.id)}" data-k="${key}"`;
  return `<button class="tx" ${attrs}><div class="ic">${esc(c.e)}</div>
    <div class="mid"><div class="d1">${esc(x.d||c.name)}${tags}</div><div class="d2">${dd}${x.d?" · "+esc(c.name):""}${x.pm&&!x.v?" · "+PM[x.pm]:""}</div></div>
    <div class="amt num ${x.t==="in"?"in":""}">${x.t==="in"?"+":"−"}${money(x.c)}</div></button>`;
}
const insList=ins=>`<ul class="insights">${ins.map(i=>`<li><span class="e">${i[0]}</span><span>${i[1]}</span></li>`).join("")}</ul>`;

function goalBlock(key,s){
  const G=settings.goal; if(!(G>0)||key>todayKey) return "";
  const sobra=s.inc-s.out, p=Math.max(0,Math.min(100,Math.round(sobra/G*100)));
  let msg;
  if(key===todayKey){
    const pode=s.inc-G-s.out, rest=daysIn(key)-today.getDate()+1;
    if(s.inc<=0) msg="Cadastre o que você ganha para acompanhar a meta.";
    else if(pode>=0) msg=`Dá para gastar mais <b>${money(pode)}</b> até o fim do mês (≈ ${money(Math.floor(pode/rest))} por dia) e ainda guardar ${money(G)}.`;
    else msg=`Você já passou <b>${money(-pode)}</b> do que dava para gastar. ${sobra>0?`Do jeito que está, vai guardar ${money(sobra)}.`:"Este mês está gastando mais do que ganha."}`;
  } else msg=sobra>=G?`✅ Meta batida! Guardou ${money(sobra)}.`:`Meta não batida: guardou ${money(Math.max(0,sobra))} de ${money(G)} — faltaram ${money(G-Math.max(0,sobra))}.`;
  return `<div class="goal"><div class="gl"><span>🎯 Meta: guardar ${money(G)}</span><span class="num">${p}%</span></div>
    <div class="meter"><span style="width:${p}%"></span></div><div class="meter-txt">${msg}</div></div>`;
}

/* ---------- Telas ---------- */
function renderMes(){
  const key=keyOf(selY,selM); const s=stats(key); const sobra=s.inc-s.out;
  const p=stats(addMonths(key,-1)); const isCur=key===todayKey;
  const ins=limitAlerts(key,s);
  if(s.inc>0) ins.push(["📊",`Você gastou <b>${pct(s.out,s.inc)}%</b> do que ganhou ${isCur?"até agora":"neste mês"}.`]);
  else if(key<=todayKey) ins.push(["💼",`Cadastre seu salário em <b>Ajustes → Ganhos fixos</b> para ver quanto da renda está indo embora.`]);
  if(s.fixedOut>0) ins.push(["📌",`Contas fixas: <b>${money(s.fixedOut)}</b> (${pct(s.fixedOut,s.out)}% dos gastos). O resto, ${money(s.out-s.fixedOut)}, é do dia a dia.`]);
  const top=sortedCats(s.cats)[0];
  if(top) ins.push([esc(catOf(top[0]).e),`O que mais pesa: <b>${esc(catOf(top[0]).name)}</b> — ${money(top[1])} (${pct(top[1],s.out)}% dos gastos).`]);
  if(s.credit>0) ins.push(["💳",`No cartão de crédito: <b>${money(s.credit)}</b> neste mês (contando parcelas).`]);
  if(p.out>0&&s.out>0){const d=Math.round((s.out-p.out)/p.out*100); if(d!==0) ins.push([d>0?"🔺":"🔻",`Gastou <b>${Math.abs(d)}% ${d>0?"a mais":"a menos"}</b> que no mês anterior${isCur?" (até agora)":""}.`]);}
  if(isCur){
    const vari=s.out-s.fixedOut;
    if(vari>0){const proj=s.fixedOut+Math.round(vari/today.getDate()*daysIn(key)); ins.push(["🔮",`No ritmo atual, o mês fecha em <b>${money(proj)}</b> de gastos.`]);}
    const fut=futureInstallments(); if(fut>0) ins.push(["⏳",`Você já tem <b>${money(fut)}</b> em parcelas para os próximos meses.`]);
  }
  if(isCur&&allItems().length>=10){ const lb=settings.lastBackup, d=lb?Math.floor((today-new Date(lb+"T12:00:00"))/864e5):999; if(d>30) ins.push(["💾",lb?`Faz ${d} dias que você não salva uma cópia de segurança. Vá em <b>Ajustes → Backup</b>.`:`Salve uma cópia de segurança em <b>Ajustes → Backup</b> para não perder seus dados.`]); }
  if(key>todayKey&&s.out>0) ins.push(["🗓️","Este mês ainda não chegou: aqui estão as parcelas que já vão cair nele."]);
  let meter="";
  if(settings.limit>0){const lp=pct(s.out,settings.limit); meter=`<div class="meter"><span style="width:${Math.min(100,lp)}%;background:${lp>100?"var(--out)":lp>=80?"var(--warn)":"var(--in)"}"></span></div>
    <div class="meter-txt num">${lp}% do seu limite de ${money(settings.limit)}${lp>100?" — passou do limite":""}</div>`;}
  else if(s.inc>0){const lp=pct(s.out,s.inc); meter=`<div class="meter"><span style="width:${Math.min(100,lp)}%"></span></div><div class="meter-txt num">${lp}% da renda já foi gasta</div>`;}
  const items=s.items.slice().sort((a,b)=>b.date.localeCompare(a.date));
  $("view").innerHTML=`
  <section class="card hero">
    <div class="lbl">Sobrou no mês</div>
    <div class="big num ${sobra>=0?"pos":"neg"}">${sobra<0?"−":""}${money(Math.abs(sobra))}</div>
    <div class="pair">
      <div class="pill in"><div class="lbl">Ganhei</div><div class="v num">${money(s.inc)}</div></div>
      <div class="pill out"><div class="lbl">Gastei</div><div class="v num">${money(s.out)}</div></div>
    </div>${meter}${goalBlock(key,s)}
  </section>
  ${ins.length?`<section class="card"><h2>Resumo</h2>${insList(ins)}</section>`:""}
  <section class="card"><h2>Para onde foi o dinheiro</h2>${catRows(s.cats,s.out,key<=todayKey?settings.catLimits:null)}</section>
  <section class="card"><h2>Lançamentos do mês</h2>
    ${items.length?items.map(x=>txRow(x,key)).join(""):'<div class="empty">Nada lançado neste mês.<br>Toque no <b>+</b> para adicionar um gasto,<br>ou importe o extrato em <b>Ajustes</b>.</div>'}
  </section>`;
}

function yearChart(y){
  const data=[];let max=0;
  for(let m=0;m<12;m++){const s=stats(keyOf(y,m));data.push(s);max=Math.max(max,s.inc,s.out);}
  if(max===0) return '<div class="empty">Sem lançamentos neste ano.</div>';
  const W=340,H=190,top=18,bot=22,ch=H-top-bot,gw=W/12,bw=Math.min(10,(gw-6)/2);
  let g=`<line x1="0" x2="${W}" y1="${top}" y2="${top}" stroke="var(--line)" stroke-dasharray="3 3"/>
  <text x="${W}" y="${top-5}" text-anchor="end" font-size="10" fill="var(--muted)">${money(max).replace(/,\d\d$/,"")}</text>
  <line x1="0" x2="${W}" y1="${top+ch}" y2="${top+ch}" stroke="var(--line)"/>`;
  data.forEach((s,i)=>{
    const cx=i*gw+gw/2, hi=s.inc/max*ch, ho=s.out/max*ch, k=keyOf(y,i), fut=k>todayKey;
    if(hi>0) g+=`<rect x="${cx-bw-1}" y="${top+ch-hi}" width="${bw}" height="${hi}" rx="2" fill="var(--in)"/>`;
    if(ho>0) g+=`<rect x="${cx+1}" y="${top+ch-ho}" width="${bw}" height="${ho}" rx="2" fill="var(--out)" ${fut?'opacity=".45"':""}/>`;
    g+=`<text x="${cx}" y="${H-6}" text-anchor="middle" font-size="10.5" fill="${k===todayKey?"var(--ink)":"var(--muted)"}" font-weight="${k===todayKey?700:400}">${MES3[i]}</text>
    <rect class="hit" data-m="${i}" x="${i*gw}" y="0" width="${gw}" height="${H}" fill="transparent" style="cursor:pointer"/>`;
  });
  return `<div class="legend"><span><i style="background:var(--in)"></i>Ganhos</span><span><i style="background:var(--out)"></i>Gastos</span><span style="margin-left:auto">toque num mês</span></div>
  <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Ganhos e gastos por mês">${g}</svg>`;
}
function renderAno(){
  const y=yearSel; let inc=0,out=0,fixedOut=0,credit=0,futOut=0,incNow=0,outNow=0; const cats={}; let maxM=-1,maxV=0,n=0,done=0,hit=0;
  for(let m=0;m<12;m++){const k=keyOf(y,m),s=stats(k); inc+=s.inc; out+=s.out; fixedOut+=s.fixedOut; credit+=s.credit;
    if(k>todayKey) futOut+=s.out; else {incNow+=s.inc; outNow+=s.out;}
    if(s.out>0&&k<=todayKey) n++; if(s.out>maxV&&k<=todayKey){maxV=s.out;maxM=m;} for(const c in s.cats) cats[c]=(cats[c]||0)+s.cats[c];
    if(k<todayKey&&(s.inc>0||s.out>0)){done++; if(s.inc-s.out>=settings.goal) hit++;}}
  const sobra=inc-out; const ins=[];
  if(settings.goal>0&&done) ins.push(["🎯",`Meta de ${money(settings.goal)}/mês batida em <b>${hit} de ${done}</b> ${done===1?"mês fechado":"meses fechados"}.`]);
  if(n) ins.push(["📅",`Média de gastos: <b>${money(Math.round(outNow/n))}</b> por mês.`]);
  if(maxM>=0) ins.push(["🔥",`Mês mais caro: <b>${MESES[maxM]}</b> (${money(maxV)}).`]);
  const top=sortedCats(cats)[0];
  if(top) ins.push([esc(catOf(top[0]).e),`No ano, <b>${esc(catOf(top[0]).name)}</b> levou ${money(top[1])} — ${pct(top[1],out)}% de tudo que você gastou.`]);
  if(fixedOut>0) ins.push(["📌",`Contas fixas somaram <b>${money(fixedOut)}</b> no ano.`]);
  if(credit>0) ins.push(["💳",`No crédito: <b>${money(credit)}</b> no ano.`]);
  if(futOut>0) ins.push(["⏳",`Já inclui <b>${money(futOut)}</b> de parcelas que ainda vão cair este ano.`]);
  if(incNow>0) ins.push(["💰",`Até agora você guardou <b>${Math.max(0,pct(incNow-outNow,incNow))}%</b> do que ganhou no ano.`]);
  $("view").innerHTML=`
  <section class="card hero">
    <div class="lbl">Sobrou no ano</div>
    <div class="big num ${sobra>=0?"pos":"neg"}">${sobra<0?"−":""}${money(Math.abs(sobra))}</div>
    <div class="pair">
      <div class="pill in"><div class="lbl">Ganhei no ano</div><div class="v num">${money(inc)}</div></div>
      <div class="pill out"><div class="lbl">Gastei no ano</div><div class="v num">${money(out)}</div></div>
    </div>
  </section>
  <section class="card"><h2>Mês a mês</h2>${yearChart(y)}</section>
  ${ins.length?`<section class="card"><h2>Resumo do ano</h2>${insList(ins)}</section>`:""}
  <section class="card"><h2>Para onde foi o dinheiro no ano</h2>${catRows(cats,out)}</section>`;
  $("view").querySelectorAll(".hit").forEach(r=>r.addEventListener("click",()=>{selY=y;selM=+r.dataset.m;go("mes");}));
}

/* Lista + busca */
let searchQ="", searchScope="ano";
function renderLista(){
  $("view").innerHTML=`<section class="card search">
    <input class="field" id="q" type="search" placeholder="🔎 Buscar — ex: iFood, Uber, mercado" value="${esc(searchQ)}" autocomplete="off" enterkeyhint="search">
    <div class="seg seg3${searchQ.trim()?"":" hidden"}" id="qs"><button data-s="mes">${MES3[selM]}/${String(selY).slice(2)}</button><button data-s="ano">${selY}</button><button data-s="tudo">Tudo</button></div>
  </section><div id="lres"></div>`;
  const qs=$("qs"); const mark=()=>qs.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.s===searchScope)); mark();
  qs.onclick=e=>{const b=e.target.closest("[data-s]"); if(!b) return; searchScope=b.dataset.s; mark(); drawResults();};
  $("q").addEventListener("input",()=>{searchQ=$("q").value; qs.classList.toggle("hidden",!searchQ.trim()); drawResults();});
  drawResults();
}
function drawResults(){
  const box=$("lres"); if(!box) return; const q=norm(searchQ);
  if(!q){
    const key=keyOf(selY,selM); const items=monthItems(key).sort((a,b)=>b.date.localeCompare(a.date));
    const groups={}; items.forEach(x=>{(groups[x.date]=groups[x.date]||[]).push(x);});
    const days=Object.keys(groups);
    box.innerHTML=days.length?days.map(d=>{
      const tot=groups[d].reduce((a,x)=>a+(x.t==="in"?0:x.c),0); const dt=new Date(d+"T12:00:00");
      return `<section class="card"><h2 style="display:flex;justify-content:space-between"><span>${dt.toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"short"})}</span><span class="num">${tot?"−"+money(tot):""}</span></h2>${groups[d].map(x=>txRow(x,key)).join("")}</section>`;
    }).join(""):'<section class="card"><div class="empty">Nada lançado neste mês.<br>Toque no <b>+</b> para adicionar.</div></section>';
    return;
  }
  const keys=searchScope==="mes"?[keyOf(selY,selM)]:searchScope==="ano"?Array.from({length:12},(_,i)=>keyOf(selY,i)):allKeys();
  const found=[]; keys.forEach(k=>monthItems(k).forEach(x=>{ if(norm(x.d).includes(q)||norm(catOf(x.cat).name).includes(q)) found.push(x); }));
  found.sort((a,b)=>b.date.localeCompare(a.date));
  const outs=found.filter(x=>x.t!=="in"), ins=found.filter(x=>x.t==="in");
  const tOut=outs.reduce((a,x)=>a+x.c,0), tIn=ins.reduce((a,x)=>a+x.c,0);
  const where=searchScope==="mes"?`em ${MESES[selM]}`:searchScope==="ano"?`em ${selY}`:"desde o começo";
  if(!found.length){ box.innerHTML=`<section class="card"><div class="empty">Nada encontrado com “${esc(searchQ.trim())}” ${where}.</div></section>`; return; }
  let h=`<section class="card hero"><div class="lbl">Gastos com “${esc(searchQ.trim())}” ${where}</div>
    <div class="big num neg" style="margin-bottom:6px">${money(tOut)}</div>
    <div class="meter-txt">${outs.length} ${outs.length===1?"vez":"vezes"}${outs.length?` · média ${money(Math.round(tOut/outs.length))}`:""}${tIn?` · ganhos: <b style="color:var(--in)">${money(tIn)}</b>`:""}</div></section>`;
  if(searchScope!=="mes"&&outs.length){
    const bym={}; outs.forEach(x=>{const k=x.date.slice(0,7); bym[k]=(bym[k]||0)+x.c;});
    const ks=Object.keys(bym).sort().reverse(); const mx=Math.max(...ks.map(k=>bym[k]));
    if(ks.length>1) h+=`<section class="card"><h2>Por mês</h2>${ks.slice(0,24).map(k=>`<div class="mrow"><span>${keyLabel(k)}</span><div class="bar"><span style="width:${Math.max(3,bym[k]/mx*100)}%"></span></div><b class="num">${money(bym[k])}</b></div>`).join("")}</section>`;
  }
  h+=`<section class="card"><h2>Lançamentos</h2>${found.slice(0,300).map(x=>txRow(x)).join("")}${found.length>300?`<div class="empty">Mostrando os 300 mais recentes.</div>`:""}</section>`;
  box.innerHTML=h;
}

/* Ajustes */
function recRows(t){
  const list=settings.rec.filter(r=>r.t===t);
  const active=list.filter(r=>!r.to||r.to>=todayKey).sort((a,b)=>b.c-a.c);
  const old=list.filter(r=>r.to&&r.to<todayKey).sort((a,b)=>b.to.localeCompare(a.to));
  const row=(r,isOld)=>{
    const c=catOf(r.cat);
    const prev=settings.rec.filter(x=>x.id!==r.id&&(x.chain||x.id)===(r.chain||r.id)&&x.from<r.from).sort((a,b)=>b.from.localeCompare(a.from))[0];
    const sub=isOld?`de ${keyLabel(r.from)} até ${keyLabel(r.to)}`:`todo dia ${r.day} · desde ${keyLabel(r.from)}${r.from>todayKey?" (começa depois)":""}${prev?` · antes ${money(prev.c)}`:""}`;
    return `<button class="rec${isOld?" old":""}" data-rid="${esc(r.id)}"><div class="tx" style="border:0;padding:0"><div class="ic">${esc(c.e)}</div>
      <div class="mid"><div class="d1">${esc(r.name)}</div><div class="d2">${sub}</div></div>
      <div class="amt num ${t==="in"?"in":""}">${money(r.c)}</div></div></button>`;
  };
  let h=active.length?active.map(r=>row(r,false)).join(""):`<div class="empty" style="padding:8px 0">${t==="in"?"Nenhum ganho fixo ainda.":"Nenhuma conta fixa ainda."}</div>`;
  if(old.length) h+=`<div class="qlbl" style="margin-top:12px">Histórico</div>`+old.map(r=>row(r,true)).join("");
  return h;
}

/* ---------- Lançamento ---------- */
let fType="out", fCat="mercado", fPm="pix", catTouched=false, editing=null;
function quickList(){
  const since=addMonths(todayKey,-4)+"-01"; const m={};
  allItems().forEach(x=>{
    if(x.t!==fType||x.g||x.date<since||(CAT[x.cat]&&CAT[x.cat].hidden)) return;
    const k=x.t+"|"+x.cat+"|"+(x.d||"").toLowerCase()+"|"+x.c;
    if(!m[k]) m[k]={x,n:0,last:""}; m[k].n++; if(x.date>=m[k].last){m[k].last=x.date;m[k].x=x;}
  });
  return Object.values(m).sort((a,b)=>b.n-a.n||b.last.localeCompare(a.last)).slice(0,8).map(o=>o.x);
}
let descMap={};
function buildDescMap(){ descMap={}; allItems().sort((a,b)=>a.date.localeCompare(b.date)).forEach(x=>{ if(x.d) descMap[x.d.toLowerCase()]={d:x.d,cat:x.cat,t:x.t,pm:x.pm}; }); }
function fillDescs(){ buildDescMap(); $("f-descs").innerHTML=Object.values(descMap).filter(o=>o.t===fType).map(o=>`<option value="${esc(o.d)}">`).join(""); }
function drawQuick(){
  const q=editing?[]:quickList();
  $("f-quickwrap").classList.toggle("hidden",!q.length);
  $("f-quick").innerHTML=q.map((x,i)=>`<button data-q="${i}">${esc(catOf(x.cat).e)} ${esc(x.d||catOf(x.cat).name)} <b class="num">${money(x.c).replace(/,00$/,"")}</b></button>`).join("");
  $("f-quick").onclick=e=>{const b=e.target.closest("[data-q]"); if(!b) return; const x=q[+b.dataset.q];
    $("f-val").value=centsToField(x.c); fCat=x.cat; $("f-desc").value=x.d||""; if(x.pm) fPm=x.pm; catTouched=true; drawCats(); drawPm(); $("f-err").textContent="";};
}
function catChips(list,sel){ return list.map(c=>`<button data-c="${esc(c.id)}" class="${c.id===sel?"on":""}"><span class="e">${esc(c.e)}</span>${esc(c.name)}</button>`).join(""); }
function drawCats(){

  if(!list.some(c=>c.id===fCat)) fCat=list[0].id;

function addMonthsDate(iso,n){ const k=addMonths(iso.slice(0,7),n); return k+"-"+pad(Math.min(+iso.slice(8,10),daysIn(k))); }
$("f-save").onclick=()=>{
  const c=parseMoney($("f-val").value);
  if(!(c>0)){ $("f-err").textContent="Digite um valor (ex: 25,90)."; return; }
  const date=$("f-date").value||todayISO;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){ $("f-err").textContent="Escolha uma data."; return; }
  const desc=$("f-desc").value.trim(); const pm=fType==="out"?fPm:undefined;
  const touched=new Set(); const wasEdit=!!editing;
  const n=(!editing&&fType==="out"&&fPm==="credito")?(+$("f-n").value||1):1;
  if(editing){
    const old=(months[editing.key]||[]).find(i=>i.id===editing.id)||{};
    months[editing.key]=(months[editing.key]||[]).filter(i=>i.id!==editing.id); touched.add(editing.key);
    const item=Object.assign({},old,{t:fType,c,cat:fCat,d:desc,date}); if(pm) item.pm=pm; else delete item.pm;
    const k=date.slice(0,7); months[k]=(months[k]||[]).concat([item]); touched.add(k);
  } else if(n>1){
    const g=uid(), base=Math.floor(c/n), rest=c-base*n;
    for(let i=0;i<n;i++){ const d=addMonthsDate(date,i), k=d.slice(0,7);
      months[k]=(months[k]||[]).concat([{id:uid()+i,t:"out",c:base+(i===0?rest:0),cat:fCat,d:desc,date:d,pm:"credito",g,n:i+1,of:n}]); touched.add(k); }
  } else {
    const item={id:uid(),t:fType,c,cat:fCat,d:desc,date}; if(pm) item.pm=pm;
    const k=date.slice(0,7); months[k]=(months[k]||[]).concat([item]); touched.add(k);
  }
  if(!wasEdit&&pm&&pm!==settings.lastPm){ settings.lastPm=pm; persistSettings(); }
  touched.forEach(persistMonth);
  let msg=wasEdit?"Alterado":n>1?`Parcelado em ${n}x`:(fType==="out"?"Gasto lançado":"Ganho lançado"), long=false;
  if(fType==="out"){ const k=date.slice(0,7), L=settings.catLimits[fCat];
    if(L>0){ const sp=stats(k).cats[fCat]||0, p=pct(sp,L); if(p>=80){ msg=`${p>100?"🚨":"⚠️"} ${catOf(fCat).name}: ${p}% do limite (${money(sp)} de ${money(L)})`; long=true; } } }
  closeSheet(); toast(msg,long?4200:2200);

];
const RULES_IN=[["salario",/salario|folha|proventos|pagto salario|pagamento de salario|vencimento/]];
function guessCat(d,t){
  const o=descMap[String(d).toLowerCase()]; if(o&&o.t===t&&CAT[o.cat]&&!CAT[o.cat].hidden) return o.cat;
  const n=" "+norm(d)+" ";
  const own=Object.values(CAT).find(c=>!c.base&&!c.hidden&&c.t===t&&norm(c.name).length>=3&&new RegExp("\\b"+norm(c.name).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).test(n));
  if(own) return own.id;
  for(const [k,re] of (t==="out"?RULES_OUT:RULES_IN)) if(re.test(n)&&CAT[k]&&!CAT[k].hidden) return k;
  const fb=t==="out"?"outros":"outros_in"; return CAT[fb]&&!CAT[fb].hidden?fb:catList(t)[0].id;
}
function cleanDesc(d){
  d=String(d||"").replace(/\s+/g," ").trim();
  d=d.replace(/^(compra no d[eé]bito|compra com cart[aã]o|compra cart[aã]o|pagamento efetuado|transfer[eê]ncia enviada pelo pix|transfer[eê]ncia recebida pelo pix|transfer[eê]ncia recebida|transfer[eê]ncia enviada|pix enviado|pix recebido)\s*[-–:]\s*/i,"");
  return d.slice(0,60)||"Sem descrição";
}
function parseDate(s){
  s=String(s||"").trim(); let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if(m){ let y=+m[3]; if(y<100) y+=2000; const mo=+m[2], d=+m[1]; if(mo<1||mo>12||d<1||d>31) return null; return `${y}-${pad(mo)}-${pad(d)}`; }
  return null;
}
function parseSigned(s){
  s=String(s||"").replace(/R\$|\s|"/g,""); if(!s) return NaN;
  const neg=/^-|^\(.*\)$|-$/.test(s); s=s.replace(/[()+\-]/g,"");
  const c=parseMoney(s); return isNaN(c)?NaN:(neg?-c:c);
}
function splitCSV(line,del){ const r=[]; let cur="",q=false;
  for(let i=0;i<line.length;i++){ const ch=line[i];
    if(q){ if(ch==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else if(ch==='"') q=true; else if(ch===del){ r.push(cur); cur=""; } else cur+=ch; }
  r.push(cur); return r.map(x=>x.trim());
}
function parseOFX(t){
  const card=/<CCSTMTRS>/i.test(t); const out=[];
  t.split(/<STMTTRN>/i).slice(1).forEach(b=>{
    const g=tag=>{const m=b.match(new RegExp("<"+tag+">([^<\\r\\n]*)","i")); return m?m[1].trim():"";};
    const dt=g("DTPOSTED").slice(0,8); const v=parseSigned(g("TRNAMT").replace(/\.(\d{1,2})$/,",$1"));
    if(!/^\d{8}$/.test(dt)||isNaN(v)||!v) return;
    out.push({date:`${dt.slice(0,4)}-${dt.slice(4,6)}-${dt.slice(6,8)}`,v,d:g("MEMO")||g("NAME"),card});
  });
  return out;
}
function parseCSV(t){
  const lines=t.replace(/^﻿/,"").split(/\r?\n/).filter(l=>l.trim());
  const hi=lines.findIndex(l=>/data|date/i.test(l)); if(hi<0) return null;
  const hl=lines[hi]; const cnt=ch=>hl.split(ch).length;
  const del=cnt(";")>cnt(",")?";":(cnt("\t")>cnt(",")?"\t":",");
  const H=splitCSV(hl,del).map(norm);
  const fi=re=>H.findIndex(h=>re.test(h));
  const di=fi(/^data|^date|data/), vi=fi(/valor|amount|quantia|montante/), ti=fi(/descri|title|titulo|hist|lancamento|memo|estabelecimento|detalhe/);
  if(di<0||vi<0) return null;
  const card=H.includes("title")&&H.includes("amount");
  const out=[];
  lines.slice(hi+1).forEach(l=>{ const c=splitCSV(l,del); const date=parseDate(c[di]); const v=parseSigned(c[vi]);
    if(!date||isNaN(v)||!v) return; out.push({date,v:card?-v:v,d:ti>=0?c[ti]:"",card}); });
  return out;
}
let impRows=[];
function buildImp(raw){
  buildDescMap();
  const existing={}; allItems().forEach(x=>{const k=x.date+"|"+x.c+"|"+x.t; existing[k]=(existing[k]||0)+1;});
  const fixed={}; new Set(raw.map(r=>r.date.slice(0,7))).forEach(m=>recFor(m).forEach(x=>{const k=m+"|"+x.c+"|"+x.t; fixed[k]=(fixed[k]||0)+1;}));
  impRows=raw.map(r=>{
    const t=r.v<0?"out":"in", c=Math.abs(r.v), raw=String(r.d||""), d=cleanDesc(raw), n=norm(raw);
    let on=true, note=""; const k=r.date+"|"+c+"|"+t, fk=r.date.slice(0,7)+"|"+c+"|"+t;
    if(existing[k]>0){ existing[k]--; on=false; note="já lançado"; }
    else if(fixed[fk]>0){ fixed[fk]--; on=false; note="já está como fixo"; }
    else if(/pagamento (de )?fatura|pagamento recebido|pgto fatura|pag fatura/.test(n)){ on=false; note="pagamento de fatura (não é gasto novo)"; }
    else if(/aplicacao|resgate|rdb|cdb|poupanca|investimento/.test(n)){ on=false; note="investimento"; }
    return {date:r.date,c,t,d,cat:guessCat(d,t),pm:r.card?"credito":(/pix/.test(n)?"pix":"debito"),on,note,manual:false};
  }).sort((a,b)=>b.date.localeCompare(a.date));
}
function drawImp(){
  const sel=impRows.filter(r=>r.on); const out=sel.filter(r=>r.t==="out").reduce((a,r)=>a+r.c,0), inc=sel.filter(r=>r.t==="in").reduce((a,r)=>a+r.c,0);

}

async function importFile(f){
  try{
    const buf=await f.arrayBuffer(); let txt;

/* ---------- Backup, compartilhar, instalar ---------- */
function saveBackup(){
  const name=`MeuBolso-backup-${todayISO}.json`;
  const data=JSON.stringify({app:"meubolso",v:1,at:new Date().toISOString(),months,settings});
  const done=()=>{ settings.lastBackup=todayISO; saveLocal(); toast("Cópia salva 👍"); render(); };
  let file=null; try{ file=new File([data],name,{type:"application/json"}); }catch(e){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:"Backup Meu Bolso"}).then(done).catch(e=>{ if(e&&e.name!=="AbortError") toast("Não consegui salvar a cópia."); });
  } else {
    const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([data],{type:"application/json"})); a.download=name;
    document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1000); done();
  }
}
async function restoreBackup(f){
  try{
    const d=JSON.parse(await f.text());
    if(!d||d.app!=="meubolso"||typeof d.months!=="object") throw 0;
    const n=Object.values(d.months).reduce((a,m)=>a+(Array.isArray(m)?m.length:0),0);
    const when=d.at?new Date(d.at).toLocaleDateString("pt-BR"):"?";
    confirmSheet("Restaurar esta cópia?",`Cópia de ${when}, com ${n} lançamentos. Os dados atuais deste celular serão substituídos.`,"Restaurar",()=>{
      months=d.months||{}; applySettings(d.settings); saveLocal(); toast("Dados restaurados!",3000); go("mes");
    });
  }catch(e){ toast("Esse arquivo não é uma cópia do Meu Bolso.",3500); }
}
function appLink(){ return location.href.split("#")[0].split("?")[0].replace(/index\.html$/,""); }
function shareApp(){
  const url=appLink(), text="Conheça o Meu Bolso, um app para controlar seus gastos. Abra no Safari (iPhone) ou Chrome (Android) e adicione à Tela de Início:";
  if(navigator.share) navigator.share({title:"Meu Bolso",text,url}).catch(()=>{});
  else { try{ navigator.clipboard.writeText(text+" "+url).then(()=>toast("Link copiado! Cole no WhatsApp.")); }catch(e){ toast(url,6000); } }
}
let deferredPrompt=null;
function setupPWA(){
  if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(()=>{});
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  const standalone=window.navigator.standalone===true||(window.matchMedia&&matchMedia("(display-mode: standalone)").matches);
  let dismissed=false; try{ dismissed=localStorage.getItem("mb_install_x")==="1"; }catch(e){}
  const box=$("install");
  $("install-x").onclick=()=>{ box.classList.add("hidden"); try{localStorage.setItem("mb_install_x","1");}catch(e){} };
  if(standalone||dismissed) return;
  if(/iphone|ipad|ipod/i.test(navigator.userAgent)){
    $("install-txt").innerHTML="<b>Instale o app:</b> toque em <b>Compartilhar</b> (↑) e depois em <b>Adicionar à Tela de Início</b>.";
    box.classList.remove("hidden");
  }
  window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); deferredPrompt=e;
    $("install-txt").innerHTML='<b>Instale o Meu Bolso</b> no seu celular. <button id="install-go" style="color:var(--brand2);font-weight:700">Instalar</button>';
    box.classList.remove("hidden");
    $("install-go").onclick=()=>{ deferredPrompt.prompt(); deferredPrompt.userChoice.finally(()=>box.classList.add("hidden")); };
  });
}

let tt; function toast(msg,ms){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("show"),ms||2200); }

/* ---------- Início ---------- */
const local=loadLocal();
if(local){ months=local.months||{}; applySettings(local.settings); }
render();
setupPWA();
(function(){const sp=$("splash"); if(!sp) return; const hide=()=>{sp.classList.add("out");setTimeout(()=>sp.remove(),400);};sp.addEventListener("click",hide);setTimeout(hide,1300);})();
})();

</script>
